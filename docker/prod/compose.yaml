name: mus-prod

services:
  postgres:
    image: postgres:16-alpine
    container_name: mus-postgres-prod
    restart: always
    security_opt:
      - no-new-privileges:true
    env_file:
      - path: ../../.env
        required: false
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mus_db}
      POSTGRES_USER: ${POSTGRES_USER:-mus_user}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD environment variable must be set in production}"
    # Security: Database port is not published to host in production; accessible only via internal mus-network
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mus_user} -d ${POSTGRES_DB:-mus_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - mus-network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: mus-rabbitmq-prod
    restart: always
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          memory: 256M
    env_file:
      - path: ../../.env
        required: false
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-mus_user}
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD environment variable must be set in production}"
    # Security: RabbitMQ ports are not published to host in production; accessible only via internal mus-network
    volumes:
      - rabbitmq_prod_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - mus-network

  redis:
    image: redis:7-alpine
    container_name: mus-redis-prod
    restart: always
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 128M
    # Security: Redis port is not published to host in production; accessible only via internal mus-network
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - mus-network

  backend:
    build:
      context: ../..
      dockerfile: docker/prod/backend.Dockerfile
    container_name: mus-backend-prod
    restart: always
    security_opt:
      - no-new-privileges:true
    env_file:
      - path: ../../.env
        required: false
    environment:
      QUARKUS_HTTP_HOST: 0.0.0.0
      QUARKUS_DATASOURCE_DB_KIND: postgresql
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-mus_db}
      QUARKUS_DATASOURCE_USERNAME: ${POSTGRES_USER:-mus_user}
      QUARKUS_DATASOURCE_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD environment variable must be set in production}"
      QUARKUS_HIBERNATE_ORM_SCHEMA_MANAGEMENT_STRATEGY: validate
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET environment variable must be set in production}"
      HOUSEKEEPING_API_KEY: "${HOUSEKEEPING_API_KEY:?HOUSEKEEPING_API_KEY environment variable must be set in production}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-https://app.${DOMAIN_NAME:-ordago.es}}"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USER:-mus_user}
      RABBITMQ_PASSWORD: "${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD environment variable must be set in production}"
      REDIS_HOST: redis
      REDIS_PORT: 6379
    # Security: Backend port is not published to host; accessible only via internal reverse proxy (Caddy)
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mus-network

  frontend:
    build:
      context: ../..
      dockerfile: docker/prod/frontend.Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://api.${DOMAIN_NAME:-ordago.es}}
        VITE_WS_BASE_URL: ${VITE_WS_BASE_URL:-wss://api.${DOMAIN_NAME:-ordago.es}}
    container_name: mus-frontend-prod
    restart: always
    security_opt:
      - no-new-privileges:true
    env_file:
      - path: ../../.env
        required: false
    # Security: Frontend HTTP port is not published to host; routed exclusively via reverse proxy (Caddy)
    depends_on:
      - backend
    networks:
      - mus-network

  caddy:
    image: caddy:2-alpine
    container_name: mus-caddy-prod
    restart: always
    security_opt:
      - no-new-privileges:true
    env_file:
      - path: ../../.env
        required: false
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME:-ordago.es}
      ACME_EMAIL: ${ACME_EMAIL:-admin@ordago.es}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:-admin}
      BASIC_AUTH_HASH: "${BASIC_AUTH_HASH:?BASIC_AUTH_HASH environment variable must be set in production}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
    networks:
      - mus-network

  dkron:
    image: dkron/dkron:v3.2.6
    container_name: mus-dkron-prod
    restart: always
    security_opt:
      - no-new-privileges:true
    command: ["agent", "--server", "--bootstrap-expect=1", "--node-name=mus-dkron-prod"]
    env_file:
      - path: ../../.env
        required: false
    environment:
      DKRON_SERVER: "true"
      HOUSEKEEPING_API_KEY: "${HOUSEKEEPING_API_KEY:?HOUSEKEEPING_API_KEY environment variable must be set in production}"
    # Security: Dkron scheduler port is not published to host in production; accessible only via internal mus-network
    volumes:
      - dkron_prod_data:/dkron.data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8998/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      - backend
    networks:
      - mus-network

  dkron-init:
    image: curlimages/curl:8.10.1
    container_name: mus-dkron-init-prod
    restart: "no"
    security_opt:
      - no-new-privileges:true
    env_file:
      - path: ../../.env
        required: false
    environment:
      DKRON_HOST: dkron
      DKRON_PORT: 8998
      HOUSEKEEPING_API_KEY: "${HOUSEKEEPING_API_KEY:?HOUSEKEEPING_API_KEY environment variable must be set in production}"
    volumes:
      - ../dev/dkron:/opt/dkron:ro
    entrypoint: ["/bin/sh", "/opt/dkron/init-jobs.sh"]
    depends_on:
      dkron:
        condition: service_healthy
    networks:
      - mus-network

volumes:
  postgres_prod_data:
  rabbitmq_prod_data:
  redis_prod_data:
  dkron_prod_data:
  caddy_data:
  caddy_config:

networks:
  mus-network:
    driver: bridge
