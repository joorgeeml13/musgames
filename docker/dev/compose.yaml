name: mus-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: mus-postgres-dev
    restart: unless-stopped
    env_file:
      - path: ../../.env
        required: false
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mus_db}
      POSTGRES_USER: ${POSTGRES_USER:-mus_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mus_dev_password_change_in_prod}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mus_user} -d ${POSTGRES_DB:-mus_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - mus-network

  backend:
    build:
      context: ../..
      dockerfile: docker/dev/backend.Dockerfile
    container_name: mus-backend-dev
    restart: unless-stopped
    env_file:
      - path: ../../.env
        required: false
    environment:
      QUARKUS_HTTP_HOST: 0.0.0.0
      QUARKUS_DATASOURCE_DB_KIND: postgresql
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-mus_db}
      QUARKUS_DATASOURCE_USERNAME: ${POSTGRES_USER:-mus_user}
      QUARKUS_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-mus_dev_password_change_in_prod}
      QUARKUS_HIBERNATE_ORM_DATABASE_GENERATION: update
      JWT_SECRET: ${JWT_SECRET:-mus_super_secret_jwt_key_at_least_32_characters_long_for_security}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
      - "5005:5005"
    volumes:
      - ../../backend:/app
      - maven_repo_dev:/root/.m2
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mus-network

  frontend:
    build:
      context: ../..
      dockerfile: docker/dev/frontend.Dockerfile
    container_name: mus-frontend-dev
    restart: unless-stopped
    env_file:
      - path: ../../.env
        required: false
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
      VITE_WS_BASE_URL: ${VITE_WS_BASE_URL:-ws://localhost:8080}
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ../../frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - mus-network

volumes:
  postgres_dev_data:
  maven_repo_dev:

networks:
  mus-network:
    driver: bridge
