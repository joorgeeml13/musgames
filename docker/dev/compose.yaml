name: mus-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: mus-postgres-dev
    restart: unless-stopped
    env_file:
      - path: ../../.env
        required: false
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mus_db}
      POSTGRES_USER: ${POSTGRES_USER:-mus_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mus_dev_password_change_in_prod}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mus_user} -d ${POSTGRES_DB:-mus_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - mus-network

  backend:
    build:
      context: ../..
      dockerfile: docker/dev/backend.Dockerfile
    container_name: mus-backend-dev
    restart: unless-stopped
    env_file:
      - path: ../../.env
        required: false
    environment:
      QUARKUS_HTTP_HOST: 0.0.0.0
      QUARKUS_DATASOURCE_DB_KIND: postgresql
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-mus_db}
      QUARKUS_DATASOURCE_USERNAME: ${POSTGRES_USER:-mus_user}
      QUARKUS_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-mus_dev_password_change_in_prod}
      QUARKUS_HIBERNATE_ORM_SCHEMA_MANAGEMENT_STRATEGY: validate
      JWT_SECRET: ${JWT_SECRET:-mus_super_secret_jwt_key_at_least_32_characters_long_for_security}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
      - "127.0.0.1:5005:5005"
    volumes:
      - ../../apps/backend:/app
      - maven_repo_dev:/root/.m2
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mus-network

  frontend:
    build:
      context: ../..
      dockerfile: docker/dev/frontend.Dockerfile
    container_name: mus-frontend-dev
    restart: unless-stopped
    env_file:
      - path: ../../.env
        required: false
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
      VITE_WS_BASE_URL: ${VITE_WS_BASE_URL:-ws://localhost:8080}
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ../../apps/frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - mus-network

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: mus-prometheus-dev
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_dev_data:/prometheus
    networks:
      - mus-network

  loki:
    image: grafana/loki:3.1.0
    container_name: mus-loki-dev
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "127.0.0.1:${LOKI_PORT:-3100}:3100"
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_dev_data:/tmp/loki
    networks:
      - mus-network

  tempo:
    image: grafana/tempo:2.5.0
    container_name: mus-tempo-dev
    restart: unless-stopped
    command: -config.file=/etc/tempo.yaml
    ports:
      - "127.0.0.1:${TEMPO_PORT:-3200}:3200"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    volumes:
      - ./observability/tempo/tempo-config.yml:/etc/tempo.yaml:ro
      - tempo_dev_data:/tmp/tempo
    networks:
      - mus-network

  promtail:
    image: grafana/promtail:3.1.0
    container_name: mus-promtail-dev
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./observability/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - mus-network

  grafana:
    image: grafana/grafana:11.1.0
    container_name: mus-grafana-dev
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana_dev_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
      - tempo
    networks:
      - mus-network

volumes:
  postgres_dev_data:
  maven_repo_dev:
  prometheus_dev_data:
  grafana_dev_data:
  loki_dev_data:
  tempo_dev_data:

networks:
  mus-network:
    driver: bridge
