# ==============================================================================
# Mus Backend Configuration
# ==============================================================================
quarkus.application.name=mus-backend
quarkus.application.version=1.0.0-SNAPSHOT

# HTTP & CORS Configuration
quarkus.http.port=8080
quarkus.http.cors=true
quarkus.http.cors.origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
quarkus.http.cors.headers=accept, authorization, content-type, x-requested-with, accept-language
quarkus.http.cors.methods=GET, POST, PUT, DELETE, OPTIONS

# Native Resources
quarkus.native.resources.includes=messages*.properties,import.sql

# ------------------------------------------------------------------------------
# Flyway Database Migration Configuration
# ------------------------------------------------------------------------------
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=false

# ------------------------------------------------------------------------------
# PostgreSQL Database Configuration
# ------------------------------------------------------------------------------
quarkus.datasource.db-kind=postgresql

# Schema Management: Flyway manages DDL, Hibernate validates schema
quarkus.hibernate-orm.schema-management.strategy=validate

# Production profile (uses environment variables without hardcoded secret fallbacks)
%prod.quarkus.datasource.jdbc.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/mus_db}
%prod.quarkus.datasource.username=${DATABASE_USER:mus_user}
%prod.quarkus.datasource.password=${DATABASE_PASSWORD}
%prod.quarkus.hibernate-orm.schema-management.strategy=validate

# Development profile: Dev Services automatically spins up PostgreSQL container if no explicit DB is configured
%dev.quarkus.hibernate-orm.schema-management.strategy=validate
%dev.quarkus.hibernate-orm.log.sql=true

# Test profile: Dev Services automatically manages a test database
%test.quarkus.hibernate-orm.schema-management.strategy=validate
%test.quarkus.hibernate-orm.log.sql=false

# ------------------------------------------------------------------------------
# Hibernate ORM & Panache Configuration
# ------------------------------------------------------------------------------
quarkus.hibernate-orm.jdbc.statement-batch-size=25

# ------------------------------------------------------------------------------
# SmallRye JWT Configuration
# ------------------------------------------------------------------------------
mp.jwt.verify.issuer=${JWT_ISSUER:https://mus.org/issuer}
smallrye.jwt.sign.issuer=${JWT_ISSUER:https://mus.org/issuer}
# In dev and test mode, Quarkus generates an in-memory key pair automatically.
# In production, specify the public key location:
%prod.mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION:publicKey.pem}
%prod.smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY_LOCATION:privateKey.pem}

# ------------------------------------------------------------------------------
# Órdago Auth & Profile Configuration
# ------------------------------------------------------------------------------
ordago.auth.jwt.access-token-lifespan-seconds=900
ordago.auth.jwt.refresh-token-lifespan-days=30
ordago.auth.lockout.max-attempts=5
ordago.auth.lockout.duration-minutes=15
ordago.auth.refresh-token.grace-window-seconds=30
ordago.auth.argon2.memory-kb=65536
ordago.auth.argon2.iterations=3
ordago.auth.argon2.parallelism=1
ordago.auth.argon2.salt-length=16
ordago.auth.argon2.hash-length=32
ordago.auth.verification-token.duration-hours=24
ordago.auth.password-reset-token.duration-minutes=60

# ------------------------------------------------------------------------------
# WebSockets Next Configuration
# ------------------------------------------------------------------------------
quarkus.websockets-next.server.max-frame-size=65536

# ------------------------------------------------------------------------------
# Logging Configuration
# ------------------------------------------------------------------------------
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p traceId=%X{traceId} spanId=%X{spanId} [%c{3.}] (%t) %s%e%n

# ------------------------------------------------------------------------------
# OpenAPI & Swagger UI Configuration
# ------------------------------------------------------------------------------
quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.path=/q/swagger-ui
quarkus.swagger-ui.always-include=true

# ------------------------------------------------------------------------------
# Micrometer & Prometheus Metrics Configuration
# ------------------------------------------------------------------------------
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.export.prometheus.path=/q/metrics

# ------------------------------------------------------------------------------
# OpenTelemetry Tracing Configuration (Grafana Tempo)
# ------------------------------------------------------------------------------
quarkus.otel.service.name=mus-backend

%dev.quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://tempo:4317}
%dev.quarkus.otel.traces.sampler=parentbased_always_on
%dev.quarkus.otel.traces.sampler.arg=1.0

# Disable OpenTelemetry exporter and SDK during tests to avoid contacting Tempo
%test.quarkus.otel.enabled=false
%test.quarkus.otel.sdk.disabled=true
%test.quarkus.otel.exporter.otlp.enabled=false

# Disable OTLP exporter by default in prod unless explicitly enabled
%prod.quarkus.otel.exporter.otlp.enabled=${OTEL_EXPORTER_ENABLED:false}
%prod.quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
%prod.quarkus.otel.traces.sampler=parentbased_ratio
%prod.quarkus.otel.traces.sampler.arg=${OTEL_SAMPLER_RATIO:0.05}

# ------------------------------------------------------------------------------
# SmallRye Reactive Messaging — RabbitMQ Connector
# ------------------------------------------------------------------------------
mp.messaging.connector.smallrye-rabbitmq.host=${RABBITMQ_HOST:localhost}
mp.messaging.connector.smallrye-rabbitmq.port=${RABBITMQ_PORT:5672}
mp.messaging.connector.smallrye-rabbitmq.username=${RABBITMQ_USERNAME:mus_guest}
mp.messaging.connector.smallrye-rabbitmq.password=${RABBITMQ_PASSWORD:mus_guest_dev_password}

# Production overrides (strict, no default password fallback)
%prod.mp.messaging.connector.smallrye-rabbitmq.host=${RABBITMQ_HOST:rabbitmq}
%prod.mp.messaging.connector.smallrye-rabbitmq.port=${RABBITMQ_PORT:5672}
%prod.mp.messaging.connector.smallrye-rabbitmq.username=${RABBITMQ_USERNAME:mus_user}
%prod.mp.messaging.connector.smallrye-rabbitmq.password=${RABBITMQ_PASSWORD}

mp.messaging.outgoing.ordago-events-out.connector=smallrye-rabbitmq
mp.messaging.outgoing.ordago-events-out.exchange.name=ordago.events
mp.messaging.outgoing.ordago-events-out.exchange.type=topic
mp.messaging.outgoing.ordago-events-out.default-routing-key=ordago.event

